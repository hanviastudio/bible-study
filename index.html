<script>
(function(){
"use strict";
var D = JSON.parse(document.getElementById("DATA").textContent);
var lang = "en";
var esc = function(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");};
var L = function(o){ if(!o) return ""; return o[lang] || o.en || ""; };

/* ---------- portrait icons (language-independent) ---------- */
var ICON = function(id){
  var P = {
    god:'<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.6 4.6l2.1 2.1M17.3 17.3l2.1 2.1M19.4 4.6l-2.1 2.1M6.7 17.3l-2.1 2.1"/>',
    creator:'<path d="M12 2c.5 5 2 6.5 7 7-5 .5-6.5 2-7 7-.5-5-2-6.5-7-7 5-.5 6.5-2 7-7z"/>',
    redeemer:'<path d="M9.5 8H7.5a4 4 0 0 0 0 8h2M14.5 8h2a4 4 0 0 1 0 8h-2M8.5 12h7"/>',
    king:'<path d="M4 18h16M4 18l-1.2-8.6 4.8 3.5L12 6l4.4 6.9 4.8-3.5L20 18"/>',
    judge:'<path d="M12 4v16M7 20h10M4.5 7.5h15M12 4l-7.5 3.5M12 4l7.5 3.5M4.5 7.5l-2 4.2a2.6 2.6 0 0 0 4 0zM19.5 7.5l-2 4.2a2.6 2.6 0 0 0 4 0z"/>'
  };
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(P[id]||'')+'</svg>';
};

/* icons for the attributes-of-God grid (keyed on the English label) */
var ATTR_IC = {
  "Eternal":'<path d="M20.5 12a8.5 8.5 0 1 1-2.4-5.9"/><path d="M20.5 4v4.2h-4.2"/>',
  "All-powerful":'<path d="M13 2 4.5 13.5H10l-1 8.5L19.5 10H13z"/>',
  "All-knowing":'<path d="M2 12s3.8-6.5 10-6.5S22 12 22 12s-3.8 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.6"/>',
  "Everywhere present":'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.6 2.6 15.4 0 18M12 3c-2.6 2.6-2.6 15.4 0 18"/>',
  "Unchanging":'<circle cx="12" cy="5" r="2.2"/><path d="M12 7.2V21M6 13a6 6 0 0 0 12 0M4 13h2M18 13h2"/>',
  "Holy":'<path d="M12 2.5c.6 3.4 3.7 4.8 3.7 8.5a3.7 3.7 0 0 1-7.4 0c0-1.3.5-2.2.9-2.8.3 1 .9 1.6 1.7 1.6 1.1 0 1.6-1 1.1-2.3-.5-1.4-.3-3 0-4z"/>',
  "Love":'<path d="M12 20.5c-1-1-8-5.5-8-11A4.3 4.3 0 0 1 12 6.6 4.3 4.3 0 0 1 20 9.5c0 5.5-7 10-8 11z"/>',
  "Glory":'<circle cx="12" cy="12" r="3.6"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.2 5.2l1.8 1.8M17 17l1.8 1.8M18.8 5.2 17 7M7 17l-1.8 1.8"/>'
};
var attrIcon = function(en){
  var p = ATTR_IC[en]; if(!p) return '';
  return '<span class="gt-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg></span>';
};

/* ---------- overview infographic: five portraits, one thread ---------- */
var TMAP_T = {en:"The five portraits — one thread",ko:"다섯 개의 초상 — 하나의 실",zh:"五幅画像 — 一条线索"};
function threadmap(){
  var h = '<div class="tmap reveal"><div class="tmap-t">'+esc(L(TMAP_T))+'</div><div class="tmap-track">';
  D.sections.forEach(function(s){
    h += '<a class="tnode" href="#'+s.id+'" style="--dot:'+s.dot+'">'
       + '<span class="tdot">'+ICON(s.id)+'</span>'
       + '<div class="tmeta"><span class="tnum">'+s.numeral+'</span>'
       + '<span class="tname">'+esc(L(s.title))+'</span>'
       + '<span class="tthread">'+esc(L(s.thread))+'</span></div></a>';
  });
  return h + '</div></div>';
}

/* ---------- verse accordion ---------- */
function scripture(ids){
  var h = '<p class="hint">'+esc(L(D.ui.tapHint))+'</p><div class="scripture">';
  ids.forEach(function(id){
    var v = D.verses[id]; if(!v) return;
    h += '<div class="sv" data-open="0">'
      +  '<button type="button" aria-expanded="false"><span class="sv-ref">'+esc(L(v.ref))+'</span><span class="sv-plus" aria-hidden="true"></span></button>'
      +  '<div class="sv-body"><div class="sv-text">'+esc(L(v.t))+'</div></div></div>';
  });
  return h + '</div>';
}

/* ---------- diagram renderers ---------- */
var DIA = {
  clauses:function(d){
    var h='<div class="clauses">';
    d.items.forEach(function(it,i){
      h+='<div class="cl tile"><span class="cl-n">'+(i+1)+'</span><div>'
       + '<div class="cl-q">'+esc(L(it.q))+'</div><p class="cl-a">'+esc(L(it.a))+'</p>'
       + '<span class="cl-tag">'+esc(L(it.tag))+'</span></div></div>';
    });
    return h+'</div>';
  },
  grid:function(d){
    var h='<div class="gridtiles">';
    d.items.forEach(function(it){
      h+='<div class="gt tile">'+attrIcon(it.b&&it.b.en)+'<b>'+esc(L(it.b))+'</b><span>'+esc(L(it.s))+'</span><em>'+esc(L(it.e))+'</em></div>';
    });
    return h+'</div>';
  },
  formfill:function(d){
    function col(arr,head){
      var s='<div class="ff-col"><div class="ff-head">'+esc(L(head))+'</div>';
      arr.forEach(function(it){ s+='<div class="ff-cell tile"><b>'+esc(L(it.d))+'</b><span>'+esc(L(it.x))+'</span></div>'; });
      return s+'</div>';
    }
    return '<div class="ff">'+col(d.left,d.head[0])+'<div class="ff-arrow">&#8594;</div>'+col(d.right,d.head[1])+'</div>'
         + '<div class="ff-rest tile">'+esc(L(d.rest))+'</div>';
  },
  eq:function(d){
    var h='<div class="eq">';
    d.items.forEach(function(it,i){
      h+='<div class="eq-term tile"><b>'+esc(L(it.b))+'</b><span>'+esc(L(it.s))+'</span></div>';
      if(it.op) h+='<div class="eq-op">'+it.op+'</div>';
    });
    return h+'</div>';
  },
  chk:function(d){
    var h='<div class="chk">';
    d.items.forEach(function(it){
      h+='<div class="ck tile"><span class="ck-mark">&#10003;</span><div><b>'+esc(L(it.b))+'</b><span>'+esc(L(it.s))+'</span><em>'+esc(L(it.e))+'</em></div></div>';
    });
    return h+'</div>';
  },
  cmp:function(d){
    var h='<div class="cmp">';
    d.heads.forEach(function(hd){ h+='<div class="cmp-head tile">'+esc(L(hd.b))+'<small>'+esc(L(hd.s))+'</small></div>'; });
    d.rows.forEach(function(r){
      h+='<div class="cmp-label">'+esc(L(r.label))+'</div>';
      h+='<div class="cmp-row tile">'+esc(L(r.l))+'</div><div class="cmp-row tile">'+esc(L(r.r))+'</div>';
    });
    return h+'</div>';
  },
  stair:function(d){
    var h='<div class="ff-head">'+esc(L(d.downHead))+'</div><div class="stair">';
    d.down.forEach(function(s,i){
      var pad = 6 + i*14;
      h+='<div class="st tile" style="margin-left:'+Math.min(pad,68)+'px"><i>'+(i+1)+'</i><span>'+esc(L(s))+'</span></div>';
    });
    h+='</div><div class="hinge">'+esc(L(d.hinge))+'</div>';
    h+='<div class="ff-head">'+esc(L(d.upHead))+'</div><div class="stair">';
    d.up.forEach(function(s,i){
      var pad = 54 - i*16;
      h+='<div class="st tile" style="margin-left:'+Math.max(pad,0)+'px"><i>'+(i+1)+'</i><span>'+esc(L(s))+'</span></div>';
    });
    return h+'</div>';
  },
  tl:function(d){
    var h='<div class="tl">';
    d.items.forEach(function(it){
      h+='<div class="tlx"><b>'+esc(L(it.b))+'</b><span>'+esc(L(it.s))+'</span><em>'+esc(L(it.e))+'</em></div>';
    });
    return h+'</div>';
  },
  fork:function(d){
    var h='<div class="fork-stem tile">'+esc(L(d.stem))+'</div><div class="fork">';
    d.items.forEach(function(it){
      h+='<div class="fk tile"><b>'+esc(L(it.b))+'</b><span>'+esc(L(it.s))+'</span><em>'+esc(L(it.e))+'</em></div>';
    });
    return h+'</div>';
  }
};

function block(b){
  if(b.t==="p") return '<p class="reveal">'+esc(L(b.x))+'</p>';
  if(b.t==="h") return '<h3 class="reveal">'+esc(L(b.x))+'</h3>';
  if(b.t==="callout") return '<div class="callout reveal">'+esc(L(b.x))+'</div>';
  if(b.t==="s") return '<div class="reveal">'+scripture(b.v)+'</div>';
  if(b.t==="dia"){
    var t = b.title ? '<div class="dia-t">'+esc(L(b.title))+'</div>' : '';
    return '<div class="dia reveal">'+t+(DIA[b.kind]?DIA[b.kind](b):'')+'</div>';
  }
  if(b.t==="mem"){
    var v = D.verses[b.ref];
    return '<div class="memory reveal"><div class="hint">'+esc(L(D.ui.memory))+'</div><q>'+esc(L(v.t))+'</q><cite>'+esc(L(v.ref))+'</cite></div>';
  }
  if(b.t==="q"){
    var h='<h3 class="reveal">'+esc(L(D.ui.questions))+'</h3><ul class="qs">';
    b.items.forEach(function(q){ h+='<li>'+esc(L(q))+'</li>'; });
    return h+'</ul>';
  }
  return '';
}

function render(){
  document.documentElement.lang = lang;
  document.getElementById("brand").textContent = L(D.ui.brand);
  document.getElementById("foot").innerHTML = '<b>'+esc(L(D.hero.title))+'</b><br>'+esc(L(D.ui.footer));

  var h = '';
  /* hero */
  h += '<section class="field" id="top" style="--field:#14161C;--fg:#F2EFE7;--dot:#E9C46A">'
     + '<div class="wrap">'
     + '<p class="eyebrow">'+esc(L(D.hero.eyebrow))+'</p>'
     + '<div style="font-family:var(--display);font-weight:300;font-size:clamp(1.1rem,3.2vw,1.6rem);opacity:.5;letter-spacing:.02em;margin-bottom:1.6rem">'+D.hero.greek+'</div>'
     + '<h1>'+esc(L(D.hero.title))+'</h1>'
     + '<p class="lead" style="color:#E9C46A;max-width:34ch">'+esc(L(D.hero.sub))+'</p>'
     + '<hr class="hairline">'
     + '<p style="max-width:56ch">'+esc(L(D.hero.intro))+'</p>'
     + scripture(["mt16_15"])
     + threadmap()
     + '</div></section>';

  /* sections */
  D.sections.forEach(function(s){
    h += '<section class="field" id="'+s.id+'" style="--field:'+s.field+';--fg:'+s.fg+';--dot:'+s.dot+'"><div class="wrap">'
       + '<div class="sec-head reveal"><span class="sec-ic">'+ICON(s.id)+'</span>'
       + '<div><span class="numeral">'+s.numeral+'</span>'
       + '<div class="thread-tag"><i></i>'+esc(L(s.thread))+'</div></div></div>'
       + '<h2 class="reveal">'+esc(L(s.title))+'</h2>'
       + '<p class="lead reveal">'+esc(L(s.lead))+'</p>'
       + '<hr class="hairline">';
    s.blocks.forEach(function(b){ h += block(b); });
    h += '</div></section>';
  });

  /* closing */
  var c = D.closing;
  h += '<section class="field" id="thread" style="--field:#F1E9DA;--fg:#1B1B1F"><div class="wrap">'
     + '<p class="eyebrow">'+esc(L(c.eyebrow))+'</p>'
     + '<h2>'+esc(L(c.title))+'</h2>'
     + '<p class="lead">'+esc(L(c.lead))+'</p>'
     + '<hr class="hairline"><div class="recap">';
  c.rows.forEach(function(r,i){
    var sec = D.sections[i] || {};
    h += '<div class="rc tile reveal" style="--mark:'+(sec.field||'#555')+'"><span class="sec-ic">'+ICON(sec.id)+'</span><i>'+r.n+'</i><div><b>'+esc(L(r.b))+'</b><span>'+esc(L(r.s))+'</span><em>'+esc(L(r.e))+'</em></div></div>';
  });
  h += '</div><div class="callout">'+esc(L(c.final))+'</div>'
     + '<h3>'+esc(L(D.ui.questions))+'</h3><ul class="qs">';
  c.qs.forEach(function(q){ h+='<li>'+esc(L(q))+'</li>'; });
  h += '</ul></div></section>';

  document.getElementById("app").innerHTML = h;

  /* rail */
  var rail = D.sections.map(function(s){
    return '<li data-sec="'+s.id+'" style="--dot:'+s.dot+'"><a href="#'+s.id+'">'+esc(L(s.title))+'</a></li>';
  }).join("");
  document.getElementById("rail").innerHTML = rail;

  wire();
}

function wire(){
  /* accordion */
  document.querySelectorAll(".sv > button").forEach(function(btn){
    btn.addEventListener("click", function(){
      var sv = btn.parentNode, body = sv.querySelector(".sv-body");
      var open = sv.getAttribute("data-open")==="1";
      sv.setAttribute("data-open", open?"0":"1");
      btn.setAttribute("aria-expanded", open?"false":"true");
      body.style.maxHeight = open ? "0px" : (body.scrollHeight+16)+"px";
    });
  });

  /* reveal */
  if(!window.matchMedia("(prefers-reduced-motion: reduce)").matches && "IntersectionObserver" in window){
    var io = new IntersectionObserver(function(es){
      es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add("in"); io.unobserve(e.target);} });
    },{threshold:.12});
    document.querySelectorAll(".reveal").forEach(function(el){ io.observe(el); });
  } else {
    document.querySelectorAll(".reveal").forEach(function(el){ el.classList.add("in"); });
  }

  /* scroll spy */
  var secs = D.sections.map(function(s){ return document.getElementById(s.id); }).filter(Boolean);
  var items = Array.prototype.slice.call(document.querySelectorAll("#rail li"));
  var prog = document.getElementById("prog");
  function onScroll(){
    var y = window.scrollY || window.pageYOffset;
    var docH = document.body.scrollHeight - window.innerHeight;
    prog.style.width = (docH>0 ? Math.min(100,(y/docH)*100) : 0) + "%";
    var active = -1;
    secs.forEach(function(el,i){ if(el && el.offsetTop <= y + window.innerHeight*0.35) active = i; });
    items.forEach(function(li,i){
      li.setAttribute("data-on", i===active ? "1":"0");
    });
    if(active>=0) prog.style.color = D.sections[active].dot;
    else prog.style.color = "#E9C46A";
  }
  window.removeEventListener("scroll", window.__spy || function(){});
  window.__spy = onScroll;
  window.addEventListener("scroll", onScroll, {passive:true});
  onScroll();
}

/* language buttons */
document.querySelectorAll(".langs button").forEach(function(b){
  b.addEventListener("click", function(){
    lang = b.getAttribute("data-lang");
    document.querySelectorAll(".langs button").forEach(function(x){
      x.setAttribute("aria-pressed", x===b ? "true":"false");
    });
    var y = window.scrollY;
    render();
    window.scrollTo(0,y);
  });
});

render();
})();
</script>
